{% extends 'tasks/base.html' %}

{% block title %}Delete Task - Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete</h4>
            </div>
            <div class="card-body p-4">
                <p class="lead">Are you sure you want to delete this task?</p>
                <div class="alert alert-warning">
                    <strong>{{ task.title }}</strong>
                    <p class="mb-0 mt-2">This action cannot be undone. All subtasks will also be deleted.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-2"></i>Yes, Delete
                        </button>
                        <a href="{% url 'task_detail' task.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
